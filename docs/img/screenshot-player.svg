    <text x="43" y="172" font-family="-apple-system, sans-serif" font-weight="700" font-size="13" fill="#A1A1B5">9</text>
    <rect x="85" y="148" width="55" height="38" rx="6" fill="#111426" stroke="rgba(167,139,250,0.2)"/>
