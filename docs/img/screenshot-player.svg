    <rect x="150" y="148" width="55" height="38" rx="6" fill="#111426" stroke="rgba(167,139,250,0.2)"/>
    <text x="170" y="172" font-family="-apple-system, sans-serif" font-weight="700" font-size="13" fill="#A1A1B5">11</text>
    <rect x="215" y="148" width="55" height="38" rx="6" fill="#111426" stroke="rgba(167,139,250,0.2)"/>
