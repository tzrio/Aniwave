    <text x="43" y="124" font-family="-apple-system, sans-serif" font-weight="700" font-size="13" fill="#A1A1B5">5</text>
    <rect x="85" y="100" width="55" height="38" rx="6" fill="#111426" stroke="rgba(167,139,250,0.2)"/>
    <text x="108" y="124" font-family="-apple-system, sans-serif" font-weight="700" font-size="13" fill="#A1A1B5">6</text>
    <rect x="150" y="100" width="55" height="38" rx="6" fill="#111426" stroke="rgba(167,139,250,0.2)"/>
    <text x="173" y="124" font-family="-apple-system, sans-serif" font-weight="700" font-size="13" fill="#A1A1B5">7</text>
    <rect x="215" y="100" width="55" height="38" rx="6" fill="#111426" stroke="rgba(167,139,250,0.2)"/>
    <text x="238" y="124" font-family="-apple-system, sans-serif" font-weight="700" font-size="13" fill="#A1A1B5">8</text>

