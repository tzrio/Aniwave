<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" fill="none">
  <defs>
    <linearGradient id="watch-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0D17"/>
      <stop offset="100%" stop-color="#111426"/>
    </linearGradient>
    <linearGradient id="watch-accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C5CFC"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>

  <!-- Window Frame -->
  <rect width="1200" height="675" rx="16" fill="url(#watch-bg-grad)"/>

  <!-- Browser Chrome Top Bar -->
  <rect width="1200" height="42" fill="#191D31" rx="16"/>
  <rect y="26" width="1200" height="16" fill="#191D31"/>
  <circle cx="28" cy="21" r="6" fill="#EF4444"/>
  <circle cx="48" cy="21" r="6" fill="#F59E0B"/>
  <circle cx="68" cy="21" r="6" fill="#10B981"/>
  <rect x="120" y="8" width="600" height="26" rx="6" fill="#111426"/>
  <text x="140" y="25" font-family="-apple-system, sans-serif" font-size="12" fill="#A1A1B5">https://tzrio.github.io/Aniwave/watch.html#id=aot-s4&amp;ep=1 — Universal Player</text>

  <!-- SMILEORA Navbar -->
  <g transform="translate(40, 56)">
    <rect width="140" height="38" rx="19" fill="#191D31" stroke="rgba(167,139,250,0.3)"/>
    <circle cx="24" cy="19" r="10" fill="#7C5CFC"/>
    <text x="44" y="24" font-family="-apple-system, sans-serif" font-weight="900" font-size="14" fill="#F8FAFC" letter-spacing="1">SMILE<tspan fill="#A78BFA">ORA</tspan></text>
    <text x="210" y="24" font-family="-apple-system, sans-serif" font-weight="600" font-size="13" fill="#A78BFA">&larr; Kembali ke Beranda</text>
  </g>

  <!-- Player Title Header -->
  <g transform="translate(40, 114)">
    <text x="0" y="22" font-family="-apple-system, sans-serif" font-weight="900" font-size="22" fill="#F8FAFC">Attack On Titan: The Final Season</text>
    <text x="0" y="44" font-family="-apple-system, sans-serif" font-weight="700" font-size="13" fill="#A78BFA">Sedang Memutar: Episode 1 (The Other Side of the Sea)</text>

    <!-- Prev & Next Buttons -->
    <rect x="910" y="8" width="90" height="34" rx="17" fill="#191D31" stroke="rgba(167,139,250,0.2)"/>
    <text x="926" y="30" font-family="-apple-system, sans-serif" font-weight="700" font-size="12" fill="#A1A1B5">&larr; Ep Lalu</text>

    <rect x="1010" y="8" width="110" height="34" rx="17" fill="#191D31" stroke="rgba(167,139,250,0.3)"/>
    <text x="1022" y="30" font-family="-apple-system, sans-serif" font-weight="700" font-size="12" fill="#A78BFA">Ep Lanjut &rarr;</text>
  </g>

