      <rect width="170" height="120" rx="10" fill="#2C3354"/>
      <rect x="8" y="8" width="48" height="20" rx="4" fill="url(#accent-grad)"/>
      <text x="14" y="22" font-family="-apple-system, sans-serif" font-weight="800" font-size="9" fill="#FFF">SERIAL</text>
      <text x="10" y="146" font-family="-apple-system, sans-serif" font-weight="700" font-size="12" fill="#F8FAFC">Dr. Stone (S1)</text>
      <text x="10" y="166" font-family="-apple-system, sans-serif" font-size="11" fill="#A1A1B5">2019 &bull; ★ 8.28</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(190, 42)">
      <rect width="170" height="180" rx="10" fill="#191D31" stroke="rgba(167,139,250,0.15)"/>
      <rect width="170" height="120" rx="10" fill="#2C3354"/>
      <rect x="8" y="8" width="48" height="20" rx="4" fill="url(#accent-grad)"/>
      <text x="14" y="22" font-family="-apple-system, sans-serif" font-weight="800" font-size="9" fill="#FFF">SERIAL</text>
      <text x="10" y="146" font-family="-apple-system, sans-serif" font-weight="700" font-size="12" fill="#F8FAFC">The Promised Neverland</text>
      <text x="10" y="166" font-family="-apple-system, sans-serif" font-size="11" fill="#A1A1B5">2019 &bull; ★ 8.52</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(380, 42)">
      <rect width="170" height="180" rx="10" fill="#191D31" stroke="rgba(167,139,250,0.15)"/>
      <rect width="170" height="120" rx="10" fill="#2C3354"/>
      <rect x="8" y="8" width="38" height="20" rx="4" fill="url(#accent-grad)"/>
      <text x="14" y="22" font-family="-apple-system, sans-serif" font-weight="800" font-size="9" fill="#FFF">FILM</text>
      <text x="10" y="146" font-family="-apple-system, sans-serif" font-weight="700" font-size="12" fill="#F8FAFC">Your Name (Kimi no Na wa)</text>
      <text x="10" y="166" font-family="-apple-system, sans-serif" font-size="11" fill="#A1A1B5">2016 &bull; ★ 8.84</text>
    </g>

    <!-- Card 4 -->
    <g transform="translate(570, 42)">
      <rect width="170" height="180" rx="10" fill="#191D31" stroke="rgba(167,139,250,0.15)"/>
      <rect width="170" height="120" rx="10" fill="#2C3354"/>
      <rect x="8" y="8" width="48" height="20" rx="4" fill="url(#accent-grad)"/>
      <text x="14" y="22" font-family="-apple-system, sans-serif" font-weight="800" font-size="9" fill="#FFF">SERIAL</text>
      <text x="10" y="146" font-family="-apple-system, sans-serif" font-weight="700" font-size="12" fill="#F8FAFC">Attack on Titan (S3 P2)</text>
      <text x="10" y="166" font-family="-apple-system, sans-serif" font-size="11" fill="#A1A1B5">2019 &bull; ★ 9.05</text>
    </g>

    <!-- Card 5 -->
    <g transform="translate(760, 42)">
      <rect width="170" height="180" rx="10" fill="#191D31" stroke="rgba(167,139,250,0.15)"/>
      <rect width="170" height="120" rx="10" fill="#2C3354"/>
      <rect x="8" y="8" width="48" height="20" rx="4" fill="url(#accent-grad)"/>
      <text x="14" y="22" font-family="-apple-system, sans-serif" font-weight="800" font-size="9" fill="#FFF">SERIAL</text>
      <text x="10" y="146" font-family="-apple-system, sans-serif" font-weight="700" font-size="12" fill="#F8FAFC">Dr. Stone: Stone Wars</text>
      <text x="10" y="166" font-family="-apple-system, sans-serif" font-size="11" fill="#A1A1B5">2021 &bull; ★ 8.11</text>
    </g>

    <!-- Card 6 -->
    <g transform="translate(950, 42)">
      <rect width="170" height="180" rx="10" fill="#191D31" stroke="rgba(167,139,250,0.15)"/>
      <rect width="170" height="120" rx="10" fill="#2C3354"/>
      <rect x="8" y="8" width="48" height="20" rx="4" fill="url(#accent-grad)"/>
      <text x="14" y="22" font-family="-apple-system, sans-serif" font-weight="800" font-size="9" fill="#FFF">SERIAL</text>
      <text x="10" y="146" font-family="-apple-system, sans-serif" font-weight="700" font-size="12" fill="#F8FAFC">Dr. Stone: New World</text>
      <text x="10" y="166" font-family="-apple-system, sans-serif" font-size="11" fill="#A1A1B5">2023 &bull; ★ 8.27</text>
