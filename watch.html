<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nonton Anime — Aniwave</title>
  <meta name="description" content="Streaming anime online dengan player responsif, multi-server switcher, dan kualitas HD terbaik di Aniwave." />
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg" />
  <link rel="stylesheet" type="text/css" href="assets/css/theme.css" />
  <style>
    /* Styling Khusus Halaman Player / Nonton */
    .watch-container {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: var(--space-lg);
      margin-top: var(--space-md);
      margin-bottom: var(--space-2xl);
    }

    .player-card {
      background: #000;
      border-radius: var(--radius-md);
      overflow: hidden;
      border: 1px solid var(--color-border);
      box-shadow: var(--shadow-lg);
    }

    .video-viewport {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    .video-viewport iframe,
    .video-viewport video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .player-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding: 12px 16px;
      background: var(--color-surface);
      border-top: 1px solid var(--color-border);
    }

    .server-list {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-server {
      padding: 6px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.8rem;
      font-weight: 700;
      background: var(--color-bg-secondary);
      border: 1px solid var(--color-border);
      color: var(--color-text-muted);
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .btn-server:hover {
      color: var(--color-text-main);
      border-color: var(--color-primary);
    }

    .btn-server.active {
      background: var(--color-primary);
      border-color: var(--color-primary);
      color: #fff;
      box-shadow: var(--shadow-glow);
    }

    /* Episode Selector Sidebar */
    .episode-panel {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: var(--space-md);
      display: flex;
      flex-direction: column;
      max-height: 600px;
    }

    .episode-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
      gap: 8px;
      overflow-y: auto;
      padding-right: 4px;
      margin-top: 12px;
    }

    .btn-ep {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 42px;
      border-radius: var(--radius-sm);
      background: var(--color-bg-secondary);
      border: 1px solid var(--color-border);
      color: var(--color-text-main);
      font-size: 0.85rem;
      font-weight: 700;
      transition: all var(--transition-fast);
    }

    .btn-ep:hover {
      border-color: var(--color-primary);
      color: var(--color-primary-hover);
    }

    .btn-ep.active {
      background: var(--color-primary);
      border-color: var(--color-primary);
      color: #fff;
    }

    /* Cinema Mode Overlay */
    body.cinema-mode-active {
      background: #000 !important;
    }
    body.cinema-mode-active .site-header,
    body.cinema-mode-active .site-footer,
    body.cinema-mode-active .episode-panel,
    body.cinema-mode-active .watch-info-section {
      opacity: 0.15;
      pointer-events: none;
      filter: blur(2px);
      transition: all 0.3s ease;
    }

    @media (max-width: 900px) {
      .watch-container {
        grid-template-columns: 1fr;
      }
      .episode-panel {
        max-height: 320px;
      }
    }
  </style>
</head>
<body>
  <!-- Header Navigasi -->
  <header class="site-header">
    <div class="app-container">
      <nav class="nav-bar" aria-label="Navigasi Utama">
        <a class="nav-brand" href="index.html" aria-label="Beranda Aniwave">
          <span class="nav-brand-badge">
            <img class="nav-brand-logo" src="assets/img/aniwave-mark.svg" alt="" aria-hidden="true" />
            <span>Aniwave</span>
          </span>
        </a>

        <div class="nav-links">
          <a class="nav-link" href="index.html">&larr; Beranda</a>
          <a class="nav-link" id="nav-back-detail" href="anime.html">Detail Anime</a>
        </div>

        <div class="nav-actions">
          <button id="theme-toggle" class="btn-icon" type="button" aria-label="Ganti Tema">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
            </svg>
          </button>
          <div id="nav-auth-container"></div>
        </div>
      </nav>
    </div>
  </header>

  <!-- Konten Player Utama -->
  <main class="app-container">
    <!-- Judul & Breadcrumb -->
    <div style="margin-top:var(--space-md); display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
      <div>
        <h1 id="watch-anime-title" style="font-size:1.5rem; font-weight:900;">Memuat player...</h1>
        <p id="watch-ep-subtitle" style="font-size:0.9rem; color:var(--color-primary); font-weight:700;">Episode 1</p>
      </div>

      <!-- Tombol Next / Prev Episode -->
      <div style="display:flex; gap:8px;">
        <button id="btn-prev-ep" class="btn-secondary" type="button" style="font-size:0.85rem;">&larr; Ep Sebelumnya</button>
        <button id="btn-next-ep" class="btn-secondary" type="button" style="font-size:0.85rem;">Ep Selanjutnya &rarr;</button>
      </div>
    </div>

    <!-- Layout Grid: Video Player + Episode Selector -->
    <div class="watch-container">
      <!-- Sisi Kiri: Video & Server Selector -->
      <div>
        <div class="player-card">
          <div class="video-viewport">
            <iframe id="video-frame" src="" allowfullscreen title="Aniwave Video Player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
          </div>

          <div class="player-toolbar">
            <div style="display:flex; align-items:center; gap:8px;">
              <span style="font-size:0.8rem; font-weight:700; color:var(--color-text-muted);">PILIH SERVER:</span>
              <div id="server-btn-container" class="server-list">
                <!-- Diisi JS -->
              </div>
            </div>

            <div style="display:flex; gap:8px;">
              <button id="btn-cinema-mode" class="btn-secondary" type="button" style="font-size:0.8rem; padding:6px 12px;">💡 Mode Bioskop</button>
            </div>
          </div>
        </div>

        <!-- Info Sinopsis & Detail Tambahan -->
        <div class="watch-info-section" style="background:var(--color-surface); border:1px solid var(--color-border); border-radius:var(--radius-md); padding:var(--space-md); margin-top:var(--space-md);">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <h3 style="font-size:1.1rem; font-weight:800;">Tentang Episode Ini</h3>
            <span id="watch-meta-score" style="color:#facc15; font-weight:800; font-size:0.9rem;">★ —</span>
          </div>
          <p id="watch-synopsis" style="color:var(--color-text-muted); font-size:0.9rem; line-height:1.6;"></p>
        </div>
      </div>

      <!-- Sisi Kanan: Daftar Episode (1 - N) -->
      <aside class="episode-panel">
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--color-border); padding-bottom:8px;">
          <h3 style="font-size:1rem; font-weight:800;">Daftar Episode</h3>
          <span id="ep-count-badge" style="font-size:0.75rem; background:var(--color-bg-secondary); padding:2px 8px; border-radius:var(--radius-sm); color:var(--color-text-muted);">0 Ep</span>
        </div>

        <div id="episode-grid" class="episode-grid">
          <!-- Tombol episode dirender lewat JS -->
        </div>
      </aside>
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="app-container">
      <div class="footer-bottom">
        <span>&copy; 2026 Aniwave by TzRIO. Platform Streaming & Panduan Nonton Anime.</span>
        <a href="index.html" style="color:var(--color-primary); font-weight:700;">&larr; Kembali ke Katalog</a>
      </div>
    </div>
  </footer>

  <script type="module" src="assets/js/watch.js"></script>
</body>
</html>
